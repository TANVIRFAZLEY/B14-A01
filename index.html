<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DevConf 2026 Landing Page</title>
        <!-- google fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <!-- Main Stylesheet -->
        <link rel="stylesheet" href="./assets/css/style.css" />
    </head>
    <body>
        <!-- Start Header Area -->
        <header class="header-area">
            <div class="header-content container">
                <div class="site-logo">
                    <a href="./"
                        ><img
                            src="./assets/img/logo.png"
                            alt="DevConf 2026 Logo"
                    /></a>
                </div>
                <div class="main-menu">
                    <ul>
                        <li><a href="#">Speakers</a></li>
                        <li><a href="#">Schedule</a></li>
                        <li><a href="#">Tracks</a></li>
                        <li><a href="#">Venue</a></li>
                        <li><a href="#">Blog</a></li>
                    </ul>
                </div>
                <div class="header-btn">
                    <a href="#" class="common-btn">Register Now</a>
                </div>
            </div>
        </header>
        <!-- End Header Area -->
        <!-- Start Banner Area -->
        <section class="banner-area">
            <div class="banner-content container">
                <div class="banner-top">
                    <h1>Code. Connect. Create</h1>
                    <p>
                        Join 4,000+ engineers, founders, and builders at the
                        premier developer conference of 2026. Three days of
                        cutting-edge talks, hands-on workshops, and meaningful
                        connections.
                    </p>
                </div>
                <div class="banner-btn">
                    <a href="#" class="common-btn">Register Now</a>
                </div>
            </div>
        </section>
        <!-- End Banner Area -->
    </body>
</html>
